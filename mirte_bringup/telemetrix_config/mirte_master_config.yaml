/**:
  ros__parameters:
    device:
      mirte:
        type: pcb
        version: 0.6
        max_frequency: 50
        frame_prefix: 
          - mirte__
          - asdfsadfzxv
    servo:
      pincher:
        name: pincher
        device: mirte
        pins: 
          pin: GP15
      pincher2:
        name: pincher2
        device: mirte
        pins: 
          pin: 15
    intensity:
      x_axis:
        name: x_axis
        device: mirte
        pins:
          analog: 27
          # digital: GP17
      y_axis:
        name: y_axis
        device: mirte
        pins:
          analog: GP26
          # digital: GP16
      flip:
        name: flip
        device: mirte
        pins:
          # analog: GP28
          digital: GP19
      on_off:
        name: on_off
        device: mirte
        pins:
          # analog: GP29
          digital: GP18
      holonomic:
        name: holonomic
        device: mirte
        pins:
          # analog: GP30
          digital: GP20
    modules:
      as5600_M:
        device: mirte
        
        type: AS5600
        connector: I2C1
        addr: 0x36
        encoders:
          pincher: # pincher
              mux: 0
              test: 0
          shoulder_pan: # shoulder pan
              mux: 1
              test: 1
          shoulder_lift: # shoulder lift
              mux: 2
              test: 2
          elbow: # elbow?
              mux: 3
              test: 3
          wrist: # wrist?
              mux: 4
              test: 4      
      motorservocontroller:
        device: mirte
        type: PCA9685
        addr: 0x41
        connector: I2C1
          # - I2C1
          # - asdf
        frequency: 100
        motors: # TODO: No Idea which motor configuration is correct.
          rear_left:
            pin_A: 6 #0
            pin_B: 7 #1
          front_left:
            pin_A: 2
            pin_B: 3
          rear_right:
            pin_A: 5
            pin_B: 4
          front_right:
            pin_A: 1
            pin_B: 0
      servo_controller:
        device: mirte
        type: Hiwonder_Servo
        pins:
          rx: 0
          tx: 1
        servos:
          shoulder_pan:
            id: 2
            home_out: 12000
            min_angle_out: 3400
            max_angle_out: 21000
            invert: false
          shoulder_lift:
            id: 3
            home_out: 11450
            min_angle_out: 2832
            max_angle_out: 20000
            invert: false
          elbow:
            id: 4
            home_out: 11750
            min_angle_out: 120
            max_angle_out: 21000
            invert: false
          wrist:
            id: 5
            home_out: 12200
            min_angle_out: 1128
            max_angle_out: 21000
            invert: false
          gripper:
            id: 6
            home_out: 10524
            min_angle_out: 6168
            max_angle_out: 14224
            invert: false
      power_watcher:
        device: mirte
        type: INA226
        connector: I2C1
        addr: 0x40
        min_voltage: 11.1
        max_current: 5.0
        max_voltage: 15.0
        turn_off_time: 10.0
        power_low_time: 20.0
        percentage_led_pin: GPIO4_B4 # 12 = B4, left-most led on usb switcher pcb
      movement:
        device: mirte
        type: MPU9250
        connector: I2C1
    encoder:
      front_left:
        name: front_left
        device: mirte
        pins:
          A: 15 #21
          B: 14 #20
      rear_left:
        name: rear_left
        device: mirte
        pins:
          A: 17
          B: 16
      front_right:
        name: front_right
        device: mirte
        pins:
          A: 19
          B: 18
      rear_right:
        name: rear_right
        device: mirte
        pins:
          A: 20
          B: 21
    distance:
      front_left:
        name: front_left
        device: mirte
        frame_id: front_left_sonar
        max_distance: 10.01
        min_distance: 0.2
        pins:
          trigger: 6
          echo: 7
      rear_left:
        name: rear_left
        device: mirte
        frame_id: rear_left_sonar
        pins:
          trigger: 8
          echo: 9
      front_right:
        name: front_right
        device: mirte
        frame_id: front_right_sonar
        pins:
          trigger: 10
          echo: 11
      rear_right:
        name: rear_right
        device: mirte
        frame_id: rear_right_sonar
        pins:
          trigger: 12
          echo: 13
    oled:
      oled:
        device: mirte
        connector: I2C1
