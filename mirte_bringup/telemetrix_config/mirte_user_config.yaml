#        name: yellow
#        device: mirte
#        pins:
#          pin: GP28
    line:
      left:
        name: left
        device: mirte
        pins:
          analog: GP26
          digital: GP16
      right:
        name: right
        device: mirte
        pins:
          analog: GP27
          digital: GP17
    motor:
      left:
        name: left
        device: mirte
        type: pp
        pins:
          p1: GP18
          p2: GP19
      right:
        name: right
        device: mirte
        type: pp
        pins:
          p1: GP20
          p2: GP21
