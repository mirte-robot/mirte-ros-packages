#          pin: GP12
    oled:
      left:
        name: left
        device: mirte
        pins:
          scl: GP11
          sda: GP10
        # default_screen_script can be a path or package URI (pkg://PACKAGE_NAME/FOLEDRS) to a image or an executable script which provides text.
