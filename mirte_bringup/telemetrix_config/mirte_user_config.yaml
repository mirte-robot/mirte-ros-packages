/**:
  ros__parameters:
    device:
      mirte:
        type: pcb
        version: 0.8
        board: pico
        max_frequency: 25
        # The current bottleneck for the frequency is the websocket server for the webIDE.
        # If you are not using the webIDE, you can probably increase the frequency (eg.
        # to 50Hz). This all depends on the number of sensors you use, and their data-size.
        # You can check with top/htop wether you are still under 100% cpu usage.
    distance:
      left:
        name: left
        device: mirte
        pins:
          echo: GP8
          trigger: GP9
      right:
        name: right
        device: mirte
        pins:
          echo: GP6
          trigger: GP7
#     encoder:
