/**:
  ros__parameters:
    device:
      mirte:
        type: pcb
        version: 0.6
        max_frequency: 50
        frame_prefix: mirte/
    motor:
      front_left:
        name: front_left
        device: mirte
        type: pp
        pins:
          p1: 16
          p2: 17
      rear_right:
        name: rear_right
        device: mirte
        pins:
          p1: 11
          p2: 10
      rear_left:
        name: rear_left
        device: mirte
        pins:
          p1: 20
          p2: 21
      front_right:
        name: front_right
        device: mirte
        pins:
          p1: 15
          p2: 14
    # servo:
    #   pincher:
    #     name: pincher
    #     device: mirte
    #     pins: 
    #       pin: GP15
    #   pincher2:
    #     name: pincher2
    #     device: mirte
    #     pins: 
    #       pin: 15
    # intensity:
