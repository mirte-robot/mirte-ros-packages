mirte_master_base_control:
  ticks: {
    type: int,
    default_value: 1320, # TODO: check 11pps*30reduction *4
    description: "Ticks per wheel revolution, used for odometry calculations.",
  }
  use_single_update_client: {
    type: bool,
    default_value: true,
    description: "Using single update service instead of one per joint.",
  }
  single_update_service: {
    type: string,
    default_value: "/io/motor/motorservocontroller/set_multiple_speeds",
    description: "Service for single update service.",
  }