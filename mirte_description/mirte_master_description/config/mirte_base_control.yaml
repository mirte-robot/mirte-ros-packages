/**/controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pid_wheels_controller:
      type: pid_controller/PidController

    mirte_base_controller:
      type: mecanum_drive_controller/MecanumDriveController

    mirte_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    mirte_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

mirte_arm_controller:
  ros__parameters:
    joints:
      - arm_Rot_joint
      - arm_Shoulder_joint
      - arm_Elbow_joint
      - arm_Wrist_joint

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

mirte_gripper_controller:
  ros__parameters:
    joints:
      - Gripper_joint

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

mirte_base_controller:
  ros__parameters:
    reference_timeout: 0.25
    command_timeout: 0.25

    front_left_wheel_command_joint_name: wheel_left_front_joint
    rear_left_wheel_command_joint_name: wheel_left_rear_joint
    rear_right_wheel_command_joint_name: wheel_right_rear_joint
    front_right_wheel_command_joint_name: wheel_right_front_joint

    front_left_wheel_state_joint_name: wheel_left_front_joint
    rear_left_wheel_state_joint_name: wheel_left_rear_joint
    rear_right_wheel_state_joint_name: wheel_right_rear_joint
    front_right_wheel_state_joint_name: wheel_right_front_joint

    interface_name: velocity

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.051
      sum_of_robot_center_projection_on_X_Y_axis: 0.225

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true



/**/pid_wheels_controller:
  ros__parameters:
    command_interface: velocity

    reference_and_state_interfaces: ["velocity"]

    # reference_and_state_dof_names:
    dof_names:
      - wheel_left_front_joint
      - wheel_left_rear_joint
      - wheel_right_rear_joint
      - wheel_right_front_joint
    gains:
      wheel_left_front_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      wheel_left_rear_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      wheel_right_rear_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      wheel_right_front_joint: {p: 1.0,i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
